<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Game</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Game Collection Manager</a>
        </div>
    </nav>

    <div class="container mt-4">

        <h2>Add New Game</h2>

        <form th:action="@{/games/save}" th:object="${game}" method="post"
              class="bg-white p-4 border rounded">

            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text"
                       th:field="*{title}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Platform</label>
                <input type="text"
                       th:field="*{platform}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Genre</label>
                <input type="text"
                       th:field="*{genre}"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Release Year</label>
                <input type="number"
                       th:field="*{releaseYear}"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea th:field="*{description}"
                          class="form-control"
                          rows="4"></textarea>
            </div>

            <button type="submit" class="btn btn-success">
                Save Game
            </button>

            <a href="/games" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</body>
</html>
