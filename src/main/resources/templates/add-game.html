<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Game</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Game Collection Manager</a>
        </div>
    </nav>

    <div class="container mt-4">

        <h2>Add New Game</h2>

        <form th:action="@{/games/save}" th:object="${game}" method="post"
              class="bg-white p-4 border rounded">

            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text"
                       th:field="*{title}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Platform</label>
                <input type="text"
                       th:field="*{platform}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Genre</label>
                <input type="text"
                       th:field="*{genre}"
                       class="form-control">
            </div>
			
			<div class="mb-3">
			    <label class="form-label">Release Year</label>
			    <input type="number"
			           th:field="*{releaseYear}"
			           class="form-control">
			</div>

			<div class="mb-3">
			    <label class="form-label d-block">Completeness</label>

			    <div class="form-check">
			        <input class="form-check-input"
			               type="checkbox"
			               th:field="*{hasGame}">
			        <label class="form-check-label">Game</label>
			    </div>

			    <div class="form-check">
			        <input class="form-check-input"
			               type="checkbox"
			               th:field="*{hasBox}">
			        <label class="form-check-label">Box / Case</label>
			    </div>

			    <div class="form-check">
			        <input class="form-check-input"
			               type="checkbox"
			               th:field="*{hasManual}">
			        <label class="form-check-label">Manual</label>
			    </div>

			    <div class="form-check">
			        <input class="form-check-input"
			               type="checkbox"
			               th:field="*{sealed}">
			        <label class="form-check-label">New / Sealed</label>
			    </div>
			</div>

			<div class="mb-3">
			    <label class="form-label">Condition</label>
			    <select th:field="*{condition}" class="form-select">
			        <option value="">Select Condition</option>
			        <option value="Fair">Fair</option>
			        <option value="Good">Good</option>
			        <option value="Excellent">Excellent</option>
			        <option value="New">New</option>
			    </select>
			</div>

			<div class="mb-3">
			    <label class="form-label">Purchase Price</label>
			    <input type="number"
			           step="0.01"
			           th:field="*{purchasePrice}"
			           class="form-control">
			</div>

			<div class="mb-3">
			    <label class="form-label">Current Value</label>
			    <input type="number"
			           step="0.01"
			           th:field="*{currentValue}"
			           class="form-control">
			</div>

            <button type="submit" class="btn btn-success">
                Save Game
            </button>

            <a href="/games" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</body>
</html>
