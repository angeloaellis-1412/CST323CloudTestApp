<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Game Collection</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Game Collection Manager</a>
        </div>
    </nav>

    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>My Game Collection</h2>

            <a href="/games/add" class="btn btn-success">
                Add New Game
            </a>
        </div>

        <table class="table table-bordered table-striped bg-white">
            <thead class="table-dark">
                <tr>
                    <th>Title</th>
                    <th>Platform</th>
                    <th>Genre</th>
                    <th>Release Year</th>
					<th>Completeness</th>
					<th>Condition</th>
					<th>Purchase Price</th>
					<th>Current Value</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="game : ${games}">
                    <td th:text="${game.title}"></td>
                    <td th:text="${game.platform}"></td>
                    <td th:text="${game.genre}"></td>
                    <td th:text="${game.releaseYear}"></td>
					<td>
					    <span th:if="${game.hasGame}">Game </span>
					    <span th:if="${game.hasBox}">Box/Case </span>
					    <span th:if="${game.hasManual}">Manual </span>
					    <span th:if="${game.sealed}">Sealed</span>
					</td>

					<td th:text="${game.condition}"></td>
					<td th:text="${game.purchasePrice != null ? '$' + #numbers.formatDecimal(game.purchasePrice, 1, 2) : ''}"></td>
					<td th:text="${game.currentValue != null ? '$' + #numbers.formatDecimal(game.currentValue, 1, 2) : ''}"></td>

                    <td>
                        <a th:href="@{/games/edit/{id}(id=${game.id})}"
                           class="btn btn-warning btn-sm">
                            Edit
                        </a>

                        <a th:href="@{/games/delete/{id}(id=${game.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this game?');">
                            Delete
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

        <a href="/" class="btn btn-secondary">
            Back to Home
        </a>

    </div>

</body>
</html>
